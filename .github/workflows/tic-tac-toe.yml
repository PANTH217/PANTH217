name: Tic-Tac-Toe Game

on:
  issues:
    types: [opened]

jobs:
  play:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, 'ttt:')
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Play Move
        run: |
          python tic_tac_toe.py "${{ github.event.issue.title }}"

      - name: Commit & Push Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Play: ${{ github.event.issue.title }} by @${{ github.event.issue.user.login }}" || exit 0
          git push

      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} -c "Thanks for playing @${{ github.event.issue.user.login }}! Your move has been processed."
