name: Update GitHub Activity

on:
  schedule:
    - cron: "0 */6 * * *" # run every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
